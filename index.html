<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEVA CENTRE - Dijital Pazaryeri</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-accent: #334155;
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --secondary: #ec4899;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 90px;
            overflow-x: hidden;
        }

        /* Ambient Background Glow */
        .glow-bg {
            position: fixed;
            top: -100px;
            left: -100px;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, var(--primary-glow) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            z-index: -1;
            animation: pulseGlow 8s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.3) translate(50px, 50px); }
        }

        /* Header Bar */
        header {
            position: sticky;
            top: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.5px;
        }

        .cart-icon-btn {
            position: relative;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .cart-icon-btn:active { transform: scale(0.9); }

        .cart-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--secondary);
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--bg-dark);
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* Container & Controls */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        .search-store-bar {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 2rem;
        }

        @media (min-width: 768px) {
            .search-store-bar { flex-direction: row; }
        }

        .input-group {
            position: relative;
            flex: 1;
        }

        .input-group i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .custom-input, .custom-select {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 16px 12px 48px;
            border-radius: 12px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .custom-select {
            padding-left: 16px;
            cursor: pointer;
        }

        .custom-input:focus, .custom-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        /* Glassmorphism Product Card */
        .product-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            position: relative;
            animation: fadeInUp 0.5s ease forwards;
        }

        .product-card:hover {
            transform: translateY(-6px);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }

        .card-img-wrapper {
            position: relative;
            width: 100%;
            height: 200px;
            background: var(--bg-accent);
            overflow: hidden;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover .card-img {
            transform: scale(1.08);
        }

        .store-tag {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .code-tag {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--primary);
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .card-body {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .product-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-footer {
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .product-price {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--success);
        }

        .btn-add-cart {
            background: linear-gradient(135deg, var(--primary), #4f46e5);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-add-cart:active { transform: scale(0.95); }

        /* Offcanvas Cart Modal */
        .cart-modal {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background: var(--bg-dark);
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
            z-index: 200;
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
        }

        .cart-modal.active { right: 0; }

        .cart-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 199;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .cart-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .cart-header {
            padding: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .cart-body {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .cart-item {
            display: flex;
            gap: 12px;
            background: var(--bg-card);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            align-items: center;
        }

        .cart-item img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
        }

        .cart-item-details { flex: 1; }

        .cart-item-title { font-weight: 600; font-size: 0.9rem; margin-bottom: 2px; }
        .cart-item-code { font-size: 0.75rem; color: var(--text-muted); }
        .cart-item-price { font-weight: 700; color: var(--success); font-size: 0.95rem; margin-top: 4px; }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-accent);
            padding: 4px 8px;
            border-radius: 8px;
        }

        .qty-btn {
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            font-size: 0.9rem;
            width: 20px;
            text-align: center;
        }

        .cart-footer {
            padding: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: var(--bg-card);
        }

        .checkout-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .checkout-form input, .checkout-form textarea {
            width: 100%;
            background: var(--bg-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 12px;
            border-radius: 8px;
            color: white;
            font-size: 0.85rem;
            outline: none;
        }

        .btn-whatsapp {
            width: 100%;
            background: #25D366;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
            transition: all 0.2s ease;
        }

        .btn-whatsapp:active { transform: scale(0.98); }

        /* Admin Section Modal */
        .admin-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(15px);
            z-index: 300;
            display: none;
            overflow-y: auto;
            padding: 2rem 1rem;
        }

        .admin-modal.active { display: block; }

        .admin-container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--bg-card);
            padding: 2rem;
            border-radius: var(--radius);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .btn-primary {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Loading Spinner */
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border-left-color: var(--primary);
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="glow-bg"></div>

    <header>
        <div class="logo">
            <i class="fa-solid fa-store"></i> DEVA CENTRE
        </div>
        <button class="cart-icon-btn" onclick="toggleCart(true)">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="cart-badge" id="cartBadge">0</span>
        </button>
    </header>

    <div class="container">
        <div class="search-store-bar">
            <div class="input-group">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" class="custom-input" placeholder="Ürün adı veya 6 haneli kod yazın..." oninput="filterProducts()">
            </div>
            <div style="min-width: 200px;">
                <select id="storeFilter" class="custom-select" onchange="filterProducts()">
                    <option value="ALL">Tüm Mağazalar</option>
                </select>
            </div>
        </div>

        <div class="product-grid" id="productGrid">
            <div style="grid-column: 1/-1; text-align: center; padding: 3rem;">
                <div class="spinner"></div>
                <p style="margin-top: 10px; color: var(--text-muted);">Ürünler yükleniyor...</p>
            </div>
        </div>
    </div>

    <div class="cart-overlay" id="cartOverlay" onclick="toggleCart(false)"></div>
    <div class="cart-modal" id="cartModal">
        <div class="cart-header">
            <h3 style="display: flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-bag-shopping" style="color: var(--primary);"></i> Sepetim
            </h3>
            <i class="fa-solid fa-xmark" style="cursor: pointer; font-size: 1.2rem;" onclick="toggleCart(false)"></i>
        </div>
        <div class="cart-body" id="cartItemsContainer">
            </div>
        <div class="cart-footer">
            <div style="display: flex; justify-content: space-between; margin-bottom: 12px; font-weight: 700;">
                <span>Toplam Tutar:</span>
                <span id="cartTotal" style="color: var(--success); font-size: 1.2rem;">0.00 TL</span>
            </div>
            <div class="checkout-form">
                <input type="text" id="custName" placeholder="Ad Soyadınız" required>
                <textarea id="custAddress" rows="2" placeholder="Teslimat Adresiniz" required></textarea>
            </div>
            <button class="btn-whatsapp" onclick="checkoutWhatsApp()">
                <i class="fa-brands fa-whatsapp" style="font-size: 1.3rem;"></i> Siparişi Onayla
            </button>
        </div>
    </div>

    <div class="admin-modal" id="adminModal">
        <div class="admin-container">
            <div class="admin-header">
                <h3><i class="fa-solid fa-user-shield" style="color: var(--secondary);"></i> Admin Yönetim Paneli</h3>
                <i class="fa-solid fa-xmark" style="cursor: pointer;" onclick="closeAdmin()"></i>
            </div>
            
            <div style="background: var(--bg-dark); padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem;">
                <h4 style="margin-bottom: 10px; font-size: 0.95rem;">Mağaza Ekle</h4>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="newStoreName" class="custom-input" style="padding-left: 12px;" placeholder="Mağaza Adı">
                    <button class="btn-primary" style="width: auto; padding: 0 15px;" onclick="addStore()">Ekle</button>
                </div>
            </div>

            <div>
                <h4 style="margin-bottom: 10px; font-size: 0.95rem;">Yeni Ürün Ekle</h4>
                <div class="form-group">
                    <label>Mağaza Seç</label>
                    <select id="adminStoreSelect" class="custom-select" style="padding-left: 12px;"></select>
                </div>
                <div class="form-group">
                    <label>Ürün Adı</label>
                    <input type="text" id="pName" class="custom-input" style="padding-left: 12px;">
                </div>
                <div class="form-group">
                    <label>Fiyat (TL)</label>
                    <input type="number" id="pPrice" class="custom-input" style="padding-left: 12px;">
                </div>
                <div class="form-group">
                    <label>Açıklama</label>
                    <input type="text" id="pDesc" class="custom-input" style="padding-left: 12px;">
                </div>
                <div class="form-group">
                    <label>Görsel Seç</label>
                    <input type="file" id="pImg" class="custom-input" style="padding-left: 12px;" accept="image/*">
                </div>
                <button class="btn-primary" id="btnSaveProduct" onclick="saveProduct()">
                    <i class="fa-solid fa-plus"></i> Ürünü Kaydet
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Provided Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDofUXCUuZ8wh_HaC0ooN9IDnBv7ouGSRg",
            authDomain: "deva-centre.firebaseapp.com",
            projectId: "deva-centre",
            storageBucket: "deva-centre.firebasestorage.app",
            messagingSenderId: "54798317447",
            appId: "1:54798317447:web:2f600bb7e62f0782f38522",
            databaseURL: "https://deva-centre-default-rtdb.firebaseio.com"
        };

        // ImgBB API Key & Target WhatsApp Number
        const IMGBB_API_KEY = "530ae4fc7a3ac2e3ee4572ab198ec6d3";
        const WHATSAPP_NUMBER = "905518329861";

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Global State
        let allProducts = [];
        let allStores = [];
        let cart = [];

        // Dynamic Admin Password check helper
        const ADMIN_PASS = "bok bulursun ben malmıyım kodun içerisine yazayım şifreyi";

        // Route Handler (#admin)
        window.addEventListener('hashchange', checkHash);
        window.addEventListener('load', () => {
            checkHash();
            initDataListeners();
        });

        function checkHash() {
            if (window.location.hash === "#admin") {
                const pass = prompt("Admin Paneli Giriş Şifresi:");
                if (pass === ADMIN_PASS) {
                    document.getElementById('adminModal').classList.add('active');
                } else {
                    alert("Hatalı Şifre!");
                    window.location.hash = "";
                }
            }
        }

        window.closeAdmin = () => {
            document.getElementById('adminModal').classList.remove('active');
            window.location.hash = "";
        };

        // Realtime Database Listeners
        function initDataListeners() {
            // Fetch Stores
            onValue(ref(db, 'stores'), (snapshot) => {
                allStores = [];
                const data = snapshot.val();
                if (data) {
                    Object.keys(data).forEach(key => allStores.push(data[key].name));
                }
                updateStoreDropdowns();
            });

            // Fetch Products
            onValue(ref(db, 'products'), (snapshot) => {
                allProducts = [];
                const data = snapshot.val();
                if (data) {
                    Object.keys(data).forEach(key => {
                        allProducts.push({ id: key, ...data[key] });
                    });
                }
                renderProducts(allProducts);
            });
        }

        // Store Utilities
        window.addStore = () => {
            const name = document.getElementById('newStoreName').value.trim();
            if (!name) return alert("Mağaza adı boş olamaz!");
            push(ref(db, 'stores'), { name });
            document.getElementById('newStoreName').value = "";
            alert("Mağaza başarıyla eklendi.");
        };

        function updateStoreDropdowns() {
            const storeFilter = document.getElementById('storeFilter');
            const adminSelect = document.getElementById('adminStoreSelect');

            storeFilter.innerHTML = '<option value="ALL">Tüm Mağazalar</option>';
            adminSelect.innerHTML = '';

            allStores.forEach(store => {
                storeFilter.innerHTML += `<option value="${store}">${store}</option>`;
                adminSelect.innerHTML += `<option value="${store}">${store}</option>`;
            });
        }

        // Helper: Generate Random 6-digit Code
        function generate6DigitCode() {
            return Math.floor(100000 + Math.random() * 900000).toString();
        }

        // Product Upload & Saving
        window.saveProduct = async () => {
            const store = document.getElementById('adminStoreSelect').value;
            const title = document.getElementById('pName').value.trim();
            const price = parseFloat(document.getElementById('pPrice').value);
            const desc = document.getElementById('pDesc').value.trim();
            const fileInput = document.getElementById('pImg');

            if (!store || !title || isNaN(price) || !fileInput.files[0]) {
                return alert("Lütfen tüm alanları ve görseli doldurun!");
            }

            const btn = document.getElementById('btnSaveProduct');
            btn.disabled = true;
            btn.innerHTML = `<div class="spinner"></div> Yükleniyor...`;

            try {
                // Image Upload to ImgBB
                const formData = new FormData();
                formData.append("image", fileInput.files[0]);

                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: "POST",
                    body: formData
                });
                const resData = await response.json();

                if (resData.success) {
                    const imgUrl = resData.data.url;
                    const code = generate6DigitCode();

                    // Push to Firebase Realtime Database
                    await push(ref(db, 'products'), {
                        code,
                        store,
                        title,
                        price,
                        desc,
                        imgUrl,
                        createdAt: Date.now()
                    });

                    alert("Ürün başarıyla eklendi! Ürün Kodu: " + code);
                    document.getElementById('pName').value = "";
                    document.getElementById('pPrice').value = "";
                    document.getElementById('pDesc').value = "";
                    fileInput.value = "";
                } else {
                    alert("Resim yüklenemedi!");
                }
            } catch (err) {
                console.error(err);
                alert("Bir hata oluştu!");
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-plus"></i> Ürünü Kaydet`;
            }
        };

        // Render Product Cards
        function renderProducts(products) {
            const container = document.getElementById('productGrid');
            if (products.length === 0) {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 2rem;">Henüz ürün bulunmuyor.</div>`;
                return;
            }

            container.innerHTML = products.map(p => `
                <div class="product-card">
                    <div class="card-img-wrapper">
                        <span class="store-tag"><i class="fa-solid fa-shop"></i> ${p.store}</span>
                        <span class="code-tag">#${p.code}</span>
                        <img src="${p.imgUrl}" class="card-img" alt="${p.title}" loading="lazy">
                    </div>
                    <div class="card-body">
                        <div class="product-title">${p.title}</div>
                        <div class="product-desc">${p.desc || ''}</div>
                        <div class="card-footer">
                            <div class="product-price">${p.price.toFixed(2)} TL</div>
                            <button class="btn-add-cart" onclick="addToCart('${p.id}')">
                                <i class="fa-solid fa-cart-plus"></i> Ekle
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Filter Logic
        window.filterProducts = () => {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const store = document.getElementById('storeFilter').value;

            const filtered = allProducts.filter(p => {
                const matchesSearch = p.title.toLowerCase().includes(query) || p.code.includes(query);
                const matchesStore = (store === 'ALL') || (p.store === store);
                return matchesSearch && matchesStore;
            });

            renderProducts(filtered);
        };

        // Cart Functionalities (Trendyol Style)
        window.addToCart = (id) => {
            const product = allProducts.find(p => p.id === id);
            if (!product) return;

            const existingIndex = cart.findIndex(item => item.id === id);
            if (existingIndex > -1) {
                cart[existingIndex].qty += 1;
            } else {
                cart.push({ ...product, qty: 1 });
            }

            updateCartUI();
            toggleCart(true);
        };

        window.updateQty = (id, change) => {
            const index = cart.findIndex(item => item.id === id);
            if (index > -1) {
                cart[index].qty += change;
                if (cart[index].qty <= 0) {
                    cart.splice(index, 1);
                }
            }
            updateCartUI();
        };

        function updateCartUI() {
            const badge = document.getElementById('cartBadge');
            const totalQty = cart.reduce((acc, item) => acc + item.qty, 0);
            badge.innerText = totalQty;

            const container = document.getElementById('cartItemsContainer');
            if (cart.length === 0) {
                container.innerHTML = `<div style="text-align: center; color: var(--text-muted); margin-top: 2rem;">Sepetiniz boş.</div>`;
                document.getElementById('cartTotal').innerText = "0.00 TL";
                return;
            }

            let totalPrice = 0;
            container.innerHTML = cart.map(item => {
                const itemTotal = item.price * item.qty;
                totalPrice += itemTotal;
                return `
                    <div class="cart-item">
                        <img src="${item.imgUrl}" alt="${item.title}">
                        <div class="cart-item-details">
                            <div class="cart-item-title">${item.title}</div>
                            <div class="cart-item-code">${item.store} | Kod: #${item.code}</div>
                            <div class="cart-item-price">${itemTotal.toFixed(2)} TL</div>
                        </div>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="updateQty('${item.id}', -1)">-</button>
                            <span style="font-size: 0.85rem; font-weight:700;">${item.qty}</span>
                            <button class="qty-btn" onclick="updateQty('${item.id}', 1)">+</button>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('cartTotal').innerText = totalPrice.toFixed(2) + " TL";
        }

        window.toggleCart = (show) => {
            const modal = document.getElementById('cartModal');
            const overlay = document.getElementById('cartOverlay');
            if (show) {
                modal.classList.add('active');
                overlay.classList.add('active');
            } else {
                modal.classList.remove('active');
                overlay.classList.remove('active');
            }
        };

        // WhatsApp Checkout Directing
        window.checkoutWhatsApp = () => {
            if (cart.length === 0) return alert("Sepetinizde ürün yok!");

            const name = document.getElementById('custName').value.trim();
            const address = document.getElementById('custAddress').value.trim();

            if (!name || !address) {
                return alert("Lütfen ad, soyad ve teslimat adresinizi girin!");
            }

            let text = `🛍️ *DEVA CENTRE SİPARİŞ BİLDİRİMİ*\n\n`;
            text += `👤 *Müşteri:* ${name}\n`;
            text += `📍 *Adres:* ${address}\n\n`;
            text += `📦 *Sipariş Detayı:*\n`;

            let grandTotal = 0;
            cart.forEach((item, i) => {
                const total = item.price * item.qty;
                grandTotal += total;
                text += `${i + 1}. [${item.store}] ${item.title} (Kod: #${item.code})\n   👉 ${item.qty} Adet x ${item.price.toFixed(2)} TL = ${total.toFixed(2)} TL\n`;
            });

            text += `\n💰 *Genel Toplam:* ${grandTotal.toFixed(2)} TL`;

            const encodedText = encodeURIComponent(text);
            const waUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodedText}`;

            window.open(waUrl, '_blank');
        };
    </script>
</body>
</html>
